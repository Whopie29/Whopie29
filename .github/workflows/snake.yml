name: Generate Snake Game

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual execution

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Generate multiple snake animations with different palettes
      - name: Generate Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-default.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-neon.svg?color_snake=00FF00&color_dots=#00FFFF,#FF00FF,#FFFF00,#FFFFFF
            dist/snake-rainbow.svg?color_snake=ff0000&color_dots=#ff0000,#ffa500,#ffff00,#00ff00,#0000ff,#4b0082,#ee82ee
            dist/snake-pastel.svg?color_snake=FFC0CB&color_dots=#FFD1DC,#FFE4E1,#FFB6C1,#FFF0F5

      # 3️⃣ Upload artifacts so you can download them from Actions
      - name: Upload Snake Animations
        uses: actions/upload-artifact@v3
        with:
          name: snake-artifacts
          path: dist

      # 4️⃣ Commit and push animations to the repo
      - name: Commit and Push Snake Animations
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m "Updated Snake Game Animations 🎨🐍" || exit 0
          git push
