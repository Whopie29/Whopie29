name: Generate Snake Game

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: whopie29
          outputs: |
            dist/snake-default.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-neon.svg?color_snake=#39FF14&color_dots=#1a1a1a,#333333,#666666,#999999,#cccccc
            dist/snake-rainbow.svg?color_snake=#ff0000,#ff9900,#33cc33,#3399ff,#9933ff
            dist/snake-pastel.svg?color_snake=#ffb3ba,#ffdfba,#ffffba,#baffc9,#bae1ff
            dist/snake-glow.svg?color_snake=#00ffff&color_dots=#000000,#111111,#222222,#444444,#888888

      - name: Push Snake Animations to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
