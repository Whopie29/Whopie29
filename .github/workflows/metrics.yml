name: Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  workflow_dispatch:     # Manual run

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          template: classic
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year  # shorter time range, faster
          plugin_languages: yes
          plugin_languages_limit: 6               # fewer langs = faster
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_activity: yes
          plugin_activity_limit: 5                 # fewer events
          plugin_achievements: yes
          plugin_achievements_limit: 5
          plugin_achievements_threshold: B
          plugin_achievements_secrets: no
          plugin_achievements_display: detailed
          plugin_achievements_ignored: octonaut
          theme: dark
